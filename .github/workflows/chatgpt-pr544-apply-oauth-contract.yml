name: ChatGPT PR544 apply OAuth contract

on:
  push:
    branches:
      - chatgpt/pr544-independent-hardening-20260804

permissions:
  contents: write

concurrency:
  group: chatgpt-pr544-apply-oauth-contract
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'activate independent OAuth contract patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: git apply --check .github/chatgpt-pr544/oauth-contract.patch
      - run: git apply .github/chatgpt-pr544/oauth-contract.patch
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/unigrok_public/remote_auth.py tests/test_remote_boundary.py
          git commit -m "security: classify retryable OAuth introspection failures"
          git push origin HEAD:chatgpt/pr544-independent-hardening-20260804
