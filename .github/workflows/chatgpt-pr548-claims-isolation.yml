name: ChatGPT PR548 claims isolation

on:
  push:
    branches:
      - chatgpt/oauth-resilience-20260804
    paths:
      - .github/workflows/chatgpt-pr548-claims-isolation.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/oauth-resilience-20260804
          fetch-depth: 0
      - name: Verify branch cursor
        env:
          BASE_CODE_HEAD: b12917384640527f516b06b5a2583fcd98351f96
        run: |
          test "$(git diff --name-only "$BASE_CODE_HEAD" HEAD)" = ".github/workflows/chatgpt-pr548-claims-isolation.yml"
      - name: Apply exact locally verified patch
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/pr548-claims.patch
          printf '%s  %s\n' '86ad69abac61d3416eca3375a9a2e863ee5099489567c47ab8fa56d8390cc3d3' '/tmp/pr548-claims.patch' | sha256sum --check
          git apply --check /tmp/pr548-claims.patch
          git apply /tmp/pr548-claims.patch
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_oauth_claim_isolation.py tests/test_oauth_introspection_control_status.py tests/test_remote_auth_cancelled_outage.py tests/test_remote_boundary.py -k 'oauth or introspection or cancelled'
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build -t unigrok-pr548-claims-isolation .
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-pr548-claims-isolation.yml
          git add src/unigrok_public/remote_auth.py tests/test_oauth_claim_isolation.py
          git commit -m "fix: isolate coalesced OAuth claims" -m "Verified in GitHub Actions run $GITHUB_RUN_ID."
          git push origin HEAD:chatgpt/oauth-resilience-20260804
