name: ChatGPT PR548 claims isolation

on:
  push:
    branches:
      - chatgpt/oauth-resilience-20260804
    paths:
      - .github/workflows/chatgpt-pr548-claims-isolation.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/oauth-resilience-20260804
          fetch-depth: 0
      - name: Verify branch cursor
        env:
          EXPECTED_PARENT: b12917384640527f516b06b5a2583fcd98351f96
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/chatgpt-pr548-claims-isolation.yml"
      - name: Apply claims isolation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/unigrok_public/remote_auth.py")
          source = source_path.read_text()
          old = '''    try:
              return await asyncio.shield(task)
          except asyncio.CancelledError:
          '''
          new = '''    try:
              claims = await asyncio.shield(task)
              return dict(claims) if claims is not None else None
          except asyncio.CancelledError:
          '''
          if source.count(old) != 1:
              raise RuntimeError("OAuth await block changed")
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path("tests/test_oauth_claim_isolation.py")
          if test_path.exists():
              raise RuntimeError("claims-isolation regression already exists")
          test_path.write_text('''from __future__ import annotations

          import asyncio
          from typing import Any

          import pytest

          from unigrok_public import remote_auth

          AUTHORIZATION_SERVER = "https://auth.example.test"
          PUBLIC_RESOURCE = "https://mcp.example.test/mcp"
          INTROSPECTION_URL = "https://auth.example.test/oauth/introspect"


          def _configure_remote_oauth(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("UNIGROK_RUNTIME", "cloudrun")
              monkeypatch.setenv("UNIGROK_PUBLIC_MCP_URL", PUBLIC_RESOURCE)
              monkeypatch.setenv("UNIGROK_OAUTH_AUTHORIZATION_SERVERS", AUTHORIZATION_SERVER)
              monkeypatch.setenv("UNIGROK_OAUTH_INTROSPECTION_URL", INTROSPECTION_URL)
              monkeypatch.setenv(
                  "UNIGROK_OAUTH_SCOPES",
                  "unigrok:connect,unigrok:invoke,unigrok:review,unigrok:status",
              )
              monkeypatch.delenv("UNIGROK_SERVICE_TOKENS", raising=False)
              monkeypatch.delenv("UNIGROK_SERVICE_TOKEN_SHA256", raising=False)
              remote_auth._oauth_introspection_tasks.clear()


          @pytest.mark.asyncio
          async def test_coalesced_oauth_claims_are_isolated_per_caller(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              _configure_remote_oauth(monkeypatch)
              started = asyncio.Event()
              release = asyncio.Event()
              calls = 0

              class Response:
                  status_code = 200
                  content = b"{}"

                  def json(self) -> dict[str, Any]:
                      return {
                          "active": True,
                          "scope": "unigrok:chat",
                          "iss": AUTHORIZATION_SERVER,
                          "sub": "isolated-reviewer",
                          "aud": PUBLIC_RESOURCE,
                      }

              class Client:
                  async def __aenter__(self) -> Client:
                      return self

                  async def __aexit__(self, *_args: Any) -> None:
                      return None

                  async def post(self, *_args: Any, **_kwargs: Any) -> Response:
                      nonlocal calls
                      calls += 1
                      started.set()
                      await release.wait()
                      return Response()

              monkeypatch.setattr(
                  remote_auth.httpx,
                  "AsyncClient",
                  lambda **_kwargs: Client(),
              )

              first = asyncio.create_task(
                  remote_auth.introspect_oauth_token(
                      "isolated-token", "unigrok:chat"
                  )
              )
              await started.wait()
              second = asyncio.create_task(
                  remote_auth.introspect_oauth_token(
                      "isolated-token", "unigrok:chat"
                  )
              )
              await asyncio.sleep(0)
              release.set()
              first_claims, second_claims = await asyncio.gather(first, second)

              assert calls == 1
              assert first_claims is not None
              assert second_claims is not None
              assert first_claims == second_claims
              assert first_claims is not second_claims
              first_claims["scope"] = "mutated"
              assert second_claims["scope"] == "unigrok:chat"
          ''')
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_oauth_claim_isolation.py tests/test_oauth_introspection_control_status.py tests/test_remote_auth_cancelled_outage.py tests/test_remote_boundary.py -k 'oauth or introspection or cancelled'
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build -t unigrok-pr548-claims-isolation .
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-pr548-claims-isolation.yml
          git add src/unigrok_public/remote_auth.py tests/test_oauth_claim_isolation.py
          git commit -m "fix: isolate coalesced OAuth claims" -m "Verified in GitHub Actions run $GITHUB_RUN_ID."
          git push origin HEAD:chatgpt/oauth-resilience-20260804
