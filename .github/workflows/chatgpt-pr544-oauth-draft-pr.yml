name: ChatGPT PR544 OAuth draft PR

on:
  push:
    branches:
      - chatgpt/pr544-source-export-20260804
    paths:
      - .github/workflows/chatgpt-pr544-oauth-draft-pr.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for independent verification
        run: |
          for attempt in $(seq 1 90); do
            git fetch origin chatgpt/pr544-source-export-20260804
            if git show origin/chatgpt/pr544-source-export-20260804:.pr544-oauth-rebuild-result > /tmp/rebuild-result 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Validate verified branch head
        env:
          TARGET_BRANCH: chatgpt/pr544-independent-hardening-20260804
        run: |
          PATCH_SHA=$(sed -n 's/^patch_sha=//p' /tmp/rebuild-result)
          test -n "$PATCH_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$PATCH_SHA"
      - name: Create or recover draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: chatgpt/pr544-independent-hardening-20260804
        run: |
          TARGETED=$(sed -n 's/^targeted=//p' /tmp/rebuild-result)
          FULL=$(sed -n 's/^full=//p' /tmp/rebuild-result)
          EXISTING=$(gh pr list --head "$TARGET_BRANCH" --base main --state open --json number,url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            PR_URL="$EXISTING"
          else
            cat > /tmp/pr-body.md <<EOF
          ## Summary

          - Distinguish explicit OAuth token denial from temporary introspection-control failure.
          - Return retryable HTTP 503 responses for transport, HTTP, malformed-control-response, and shared-task cancellation failures; retain HTTP 401 for explicit denial.
          - Coalesce simultaneous introspection of the same token and scope without retaining raw bearer values.
          - Shield shared introspection work from a cancelled requesting caller.
          - Reject malformed surrogate Unicode in OAuth identity claims before canonical principal encoding.

          ## Verification

          - Targeted remote-boundary suite: $TARGETED
          - Full test suite: $FULL
          - Docker image build: passed
          - `git diff --check`: passed
          - Ruff on changed Python files: passed

          ## Provenance

          Independently implemented from public `main` in an isolated branch. Thanks to Curtis (`@cfrat33`): PR #544 supplied the donor security ideas and review stimulus. No donor-branch code was merged, copied, cherry-picked, or pushed into this branch.
          EOF
            PR_URL=$(gh pr create --draft --base main --head "$TARGET_BRANCH" --title "fix(auth): make OAuth control failures retryable" --body-file /tmp/pr-body.md)
          fi
          printf '%s\n' "$PR_URL" > /tmp/pr-url
      - name: Record publication receipt
        run: |
          git switch chatgpt/pr544-source-export-20260804
          git pull --ff-only
          {
            cat /tmp/rebuild-result
            printf 'draft_pr=%s\n' "$(cat /tmp/pr-url)"
          } > .pr544-oauth-publication-result
          git config user.name "chatgpt-recovery[bot]"
          git config user.email "chatgpt-recovery[bot]@users.noreply.github.com"
          git add .pr544-oauth-publication-result
          git commit -m "chore: record PR544 OAuth draft publication"
          git push
