name: Apply OAuth introspection status correction

on:
  push:
    branches:
      - chatgpt/oauth-resilience-20260804
    paths:
      - .github/pr548-status-fix.py
      - .github/workflows/pr548-status-fix.yml

permissions:
  contents: write

concurrency:
  group: pr548-status-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/oauth-resilience-20260804
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: python .github/pr548-status-fix.py
      - run: git rm .github/pr548-status-fix.py .github/workflows/pr548-status-fix.yml
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build --tag unigrok:pr548-status .
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix OAuth introspection error classification"
          git push origin HEAD:chatgpt/oauth-resilience-20260804
