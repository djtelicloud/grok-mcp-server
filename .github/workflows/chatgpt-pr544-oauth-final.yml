name: ChatGPT PR544 OAuth final

on:
  push:
    branches:
      - chatgpt/pr544-oauth-final-orchestrator-20260804
    paths:
      - .github/workflows/chatgpt-pr544-oauth-final.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chatgpt-pr544-oauth-final
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORCHESTRATOR_BRANCH: chatgpt/pr544-oauth-final-orchestrator-20260804
      PATCH_BRANCH: chatgpt/pr544-oauth-independent-final-20260804
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build independent patch from live main
        id: prepare
        run: |
          cp .github/chatgpt/pr544_oauth_final_transform.py /tmp/pr544_oauth_final_transform.py
          git fetch origin main
          git checkout --detach origin/main
          python /tmp/pr544_oauth_final_transform.py .
          ACTUAL=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' src/unigrok_public/remote_auth.py tests/test_remote_boundary.py | sort)
          test "$ACTUAL" = "$EXPECTED"
          git diff --check

      - name: Install locked environment
        id: install
        run: uv sync --frozen --python 3.13

      - name: Verify formatting and lint
        id: lint
        run: |
          uv run ruff format --check src/unigrok_public/remote_auth.py tests/test_remote_boundary.py
          uv run ruff check src/unigrok_public/remote_auth.py tests/test_remote_boundary.py

      - name: Run remote-boundary suite
        id: targeted
        run: uv run pytest -q tests/test_remote_boundary.py | tee /tmp/pytest-targeted.log

      - name: Run full suite
        id: full
        run: uv run pytest -q | tee /tmp/pytest-full.log

      - name: Build container
        id: docker
        run: docker build --progress=plain -t grok-mcp-server:pr544-oauth-final . | tee /tmp/docker-build.log

      - name: Commit and push verified patch
        id: publish
        run: |
          git config user.name "chatgpt-recovery[bot]"
          git config user.email "chatgpt-recovery[bot]@users.noreply.github.com"
          git add src/unigrok_public/remote_auth.py tests/test_remote_boundary.py
          git commit -m "fix(auth): make OAuth control failures retryable"
          PATCH_SHA=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$PATCH_SHA" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$PATCH_BRANCH"

      - name: Create draft pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGETED=$(tail -n 1 /tmp/pytest-targeted.log)
          FULL=$(tail -n 1 /tmp/pytest-full.log)
          cat > /tmp/pr-body.md <<EOF
          ## Summary

          - Distinguish explicit OAuth token denial from temporary introspection-control failure.
          - Return retryable HTTP 503 responses for control transport, HTTP, malformed-response, cancellation, and bounded-capacity failures while retaining HTTP 401 for explicit denial.
          - Coalesce simultaneous introspection of the same bearer digest, authorization endpoint, and required scope without retaining raw tokens.
          - Shield shared introspection work from cancellation by an individual caller.
          - Reject malformed surrogate Unicode in OAuth URLs and identity claims before principal encoding.

          ## Verification

          - Remote-boundary suite: $TARGETED
          - Full suite: $FULL
          - Ruff formatting and lint: passed
          - Docker image build: passed
          - Diff whitespace validation: passed

          ## Provenance

          Independently implemented from public `main` in an isolated branch. Thanks to Curtis (`@cfrat33`): PR #544 supplied donor security ideas and review stimulus. No donor-branch code was merged, copied, cherry-picked, or pushed into this branch.
          EOF
          PR_URL=$(gh pr list --head "$PATCH_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --draft --base main --head "$PATCH_BRANCH" --title "fix(auth): make OAuth control failures retryable" --body-file /tmp/pr-body.md)
          else
            gh pr edit "$PR_URL" --title "fix(auth): make OAuth control failures retryable" --body-file /tmp/pr-body.md
          fi
          printf 'url=%s\n' "$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr544-oauth-final-verification-${{ github.run_id }}
          path: |
            /tmp/pytest-targeted.log
            /tmp/pytest-full.log
            /tmp/docker-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record durable result
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TARGETED_OUTCOME: ${{ steps.targeted.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PATCH_SHA: ${{ steps.publish.outputs.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          TARGETED_RESULT=not_run
          FULL_RESULT=not_run
          test ! -f /tmp/pytest-targeted.log || TARGETED_RESULT=$(tail -n 1 /tmp/pytest-targeted.log)
          test ! -f /tmp/pytest-full.log || FULL_RESULT=$(tail -n 1 /tmp/pytest-full.log)
          STATUS=failed
          if [ "$PREPARE_OUTCOME" = success ] && [ "$INSTALL_OUTCOME" = success ] && [ "$LINT_OUTCOME" = success ] && [ "$TARGETED_OUTCOME" = success ] && [ "$FULL_OUTCOME" = success ] && [ "$DOCKER_OUTCOME" = success ] && [ "$PUBLISH_OUTCOME" = success ]; then
            STATUS=verified_branch_published
          fi
          if [ "$STATUS" = verified_branch_published ] && [ "$PR_OUTCOME" = success ]; then
            STATUS=verified_draft_pr_published
          fi
          git reset --hard
          git fetch origin "$ORCHESTRATOR_BRANCH"
          git checkout -B "$ORCHESTRATOR_BRANCH" "origin/$ORCHESTRATOR_BRANCH"
          {
            printf 'status=%s\n' "$STATUS"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'prepare=%s\n' "$PREPARE_OUTCOME"
            printf 'install=%s\n' "$INSTALL_OUTCOME"
            printf 'lint=%s\n' "$LINT_OUTCOME"
            printf 'targeted_outcome=%s\n' "$TARGETED_OUTCOME"
            printf 'targeted_result=%s\n' "$TARGETED_RESULT"
            printf 'full_outcome=%s\n' "$FULL_OUTCOME"
            printf 'full_result=%s\n' "$FULL_RESULT"
            printf 'docker=%s\n' "$DOCKER_OUTCOME"
            printf 'publish=%s\n' "$PUBLISH_OUTCOME"
            printf 'patch_sha=%s\n' "$PATCH_SHA"
            printf 'pr=%s\n' "$PR_OUTCOME"
            printf 'pr_url=%s\n' "$PR_URL"
          } > .pr544-oauth-final-result
          git config user.name "chatgpt-recovery[bot]"
          git config user.email "chatgpt-recovery[bot]@users.noreply.github.com"
          git add .pr544-oauth-final-result
          if ! git diff --cached --quiet; then
            git commit -m "chore: record PR544 OAuth final result"
            git push origin "$ORCHESTRATOR_BRANCH"
          fi
