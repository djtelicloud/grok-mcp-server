name: ChatGPT PR548 review markers

on:
  push:
    branches:
      - chatgpt/oauth-resilience-20260804
    paths:
      - .github/workflows/chatgpt-pr548-review-markers.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/oauth-resilience-20260804
          fetch-depth: 0
      - name: Verify branch cursor
        env:
          BASE_CODE_HEAD: c2be10d7f4b590a577fcf7877d17b0b31cadffd0
        run: |
          test "$(git diff --name-only "$BASE_CODE_HEAD" HEAD)" = ".github/workflows/chatgpt-pr548-review-markers.yml"
      - name: Apply exact locally verified patch
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/pr548-async-markers.patch
          printf '%s  %s\n' '8e51f0ec53970dae29c27135863466abca849b0f6bb0f98ccae7f4c23fbb136e' '/tmp/pr548-async-markers.patch' | sha256sum --check
          git apply --check /tmp/pr548-async-markers.patch
          git apply /tmp/pr548-async-markers.patch
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_remote_boundary.py -k 'oauth_control_outage_is_retryable_and_coalesced or cancelled_oauth_leader_does_not_cancel_shared_introspection or malformed_unicode_identity_is_consistently_denied_when_coalesced'
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build -t unigrok-pr548-review-markers .
      - name: Commit verified test markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-pr548-review-markers.yml
          git add tests/test_remote_boundary.py
          git commit -m "test: mark OAuth concurrency regressions async" -m "Verified in GitHub Actions run $GITHUB_RUN_ID."
          git push origin HEAD:chatgpt/oauth-resilience-20260804
