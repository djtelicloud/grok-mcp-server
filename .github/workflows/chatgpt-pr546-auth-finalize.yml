name: ChatGPT PR546 OAuth finalization

on:
  push:
    branches:
      - chatgpt/pr544-independent-hardening-20260804

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr544-independent-hardening-20260804
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Finalize OAuth resilience
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/unigrok_public/remote_auth.py")
          source = source_path.read_text()
          source = source.replace(
              """_oauth_introspection_tasks: dict[
              tuple[bytes, str], asyncio.Task[dict[str, Any] | None]
          ] = {}
          """,
              """_oauth_introspection_tasks: dict[
              tuple[asyncio.AbstractEventLoop, str, bytes, str],
              asyncio.Task[dict[str, Any] | None],
          ] = {}
          """,
              1,
          )
          start = source.index("def _oauth_introspection_key(")
          end = source.index("\n\ndef _metadata_url", start)
          replacement = '''def _oauth_introspection_key(
              loop: asyncio.AbstractEventLoop,
              url: str,
              token_digest: bytes,
              required: str,
          ) -> tuple[asyncio.AbstractEventLoop, str, bytes, str]:
              return loop, url, token_digest, required


          def _finish_oauth_introspection_task(
              key: tuple[asyncio.AbstractEventLoop, str, bytes, str],
              task: asyncio.Task[dict[str, Any] | None],
          ) -> None:
              if _oauth_introspection_tasks.get(key) is task:
                  _oauth_introspection_tasks.pop(key, None)
              if task.cancelled():
                  return
              with contextlib.suppress(Exception):
                  task.exception()


          async def _perform_oauth_introspection(
              token: str, required: str, url: str
          ) -> dict[str, Any] | None:
              if not token or len(token) > 8_192:
                  return None
              try:
                  async with httpx.AsyncClient(
                      timeout=5.0, follow_redirects=False, trust_env=False
                  ) as client:
                      response = await client.post(
                          url,
                          headers={
                              "Authorization": f"Bearer {token}",
                              "User-Agent": "unigrok-public-remote-mcp/1",
                          },
                          data={"required_scope": required},
                      )
              except (httpx.HTTPError, OSError, TypeError, ValueError) as exc:
                  raise OAuthIntrospectionUnavailable("oauth_control_unreachable") from exc
              if response.status_code in {401, 403}:
                  return None
              if response.status_code != 200:
                  raise OAuthIntrospectionUnavailable("oauth_control_status")
              if len(response.content) > 16_384:
                  raise OAuthIntrospectionUnavailable("oauth_control_response_too_large")
              try:
                  payload = response.json()
              except (TypeError, ValueError) as exc:
                  raise OAuthIntrospectionUnavailable("oauth_control_invalid_json") from exc
              if not isinstance(payload, dict):
                  raise OAuthIntrospectionUnavailable("oauth_control_invalid_payload")
              active = payload.get("active")
              if active is False:
                  return None
              if active is not True:
                  raise OAuthIntrospectionUnavailable("oauth_control_missing_active")
              scopes = payload.get("scope")
              granted = set(scopes.split()) if isinstance(scopes, str) else set()
              if not set(required.split()).issubset(granted):
                  return None
              principal = canonical_oauth_principal(payload.get("iss"), payload.get("sub"))
              if principal is None:
                  return None
              audience = payload.get("aud")
              if isinstance(audience, str):
                  audiences = (audience,)
              elif (
                  isinstance(audience, list)
                  and len(audience) <= 16
                  and all(isinstance(item, str) and len(item) <= 2_048 for item in audience)
              ):
                  audiences = tuple(audience)
              else:
                  return None
              if public_mcp_resource() not in audiences:
                  return None
              return {
                  "active": True,
                  "scope": scopes,
                  "unigrok_principal": principal,
                  "unigrok_auth": "oauth",
              }


          async def introspect_oauth_token(token: str, required: str) -> dict[str, Any] | None:
              url = introspection_url()
              if not url or not token or len(token) > 8_192:
                  return None
              try:
                  token_digest = hashlib.sha256(token.encode("utf-8", "strict")).digest()
              except UnicodeEncodeError:
                  return None
              loop = asyncio.get_running_loop()
              key = _oauth_introspection_key(loop, url, token_digest, required)
              task = _oauth_introspection_tasks.get(key)
              if task is None:
                  if len(_oauth_introspection_tasks) >= _OAUTH_INTROSPECTION_MAX_INFLIGHT:
                      raise OAuthIntrospectionUnavailable("oauth_control_capacity")
                  task = loop.create_task(_perform_oauth_introspection(token, required, url))
                  _oauth_introspection_tasks[key] = task
                  task.add_done_callback(
                      lambda completed, task_key=key: _finish_oauth_introspection_task(
                          task_key, completed
                      )
                  )
              try:
                  return await asyncio.shield(task)
              except asyncio.CancelledError:
                  raise
              except OAuthIntrospectionUnavailable:
                  raise
              except Exception as exc:
                  raise OAuthIntrospectionUnavailable("oauth_control_failure") from exc
          '''
          source = source[:start] + replacement + source[end:]
          source_path.write_text(source)

          test_path = Path("tests/test_remote_boundary.py")
          tests = test_path.read_text()
          start = tests.index(
              "async def test_cancelled_oauth_leader_does_not_cancel_shared_introspection("
          )
          end = tests.index(
              "\n\nasync def test_malformed_unicode_identity_is_consistently_denied_when_coalesced(",
              start,
          )
          replacement = '''async def test_cancelled_oauth_leader_preserves_shared_retryable_outage(
              remote_oauth_env: None, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              started = asyncio.Event()
              release = asyncio.Event()
              calls = 0

              class Client:
                  async def __aenter__(self) -> Client:
                      return self

                  async def __aexit__(self, *_args: Any) -> None:
                      return None

                  async def post(self, *_args: Any, **_kwargs: Any) -> Any:
                      nonlocal calls
                      calls += 1
                      started.set()
                      await release.wait()
                      raise remote_auth.httpx.ConnectError("control unavailable")

              monkeypatch.setattr(remote_auth.httpx, "AsyncClient", lambda **_kwargs: Client())
              remote_auth._oauth_introspection_tasks.clear()

              async def request() -> tuple[int, dict[str, str], bytes]:
                  return await _asgi_exchange(
                      remote_auth.RemoteOAuthMiddleware(
                          lambda scope, receive, send: JSONResponse({"ok": True})(
                              scope, receive, send
                          )
                      ),
                      path="/v1/models",
                      headers=((b"authorization", b"Bearer cancelled-leader-token"),),
                  )

              leader = asyncio.create_task(request())
              await started.wait()
              follower = asyncio.create_task(request())
              await asyncio.sleep(0)
              leader.cancel()
              with pytest.raises(asyncio.CancelledError):
                  await leader
              release.set()
              status, headers, body = await follower

              assert calls == 1
              assert status == 503
              assert headers["retry-after"] == "1"
              assert headers["cache-control"] == "no-store"
              assert json.loads(body) == {"error": "authorization_service_unavailable"}
          '''
          tests = tests[:start] + replacement + tests[end:]
          tests = tests.replace(
              '''def test_canonical_oauth_principal_rejects_unpaired_surrogates(
              remote_oauth_env: None,
          ) -> None:
              assert remote_auth.canonical_oauth_principal(AUTHORIZATION_SERVER, "\\ud800") is None''',
              '''async def test_malformed_unicode_auth_material_is_denied(
              remote_oauth_env: None,
          ) -> None:
              assert remote_auth.canonical_oauth_principal(AUTHORIZATION_SERVER, "\\ud800") is None
              assert await remote_auth.introspect_oauth_token("\\ud800", "unigrok:connect") is None''',
              1,
          )
          test_path.write_text(tests)
          PY
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Focused OAuth regression
        run: uv run pytest -q tests/test_remote_boundary.py -k 'oauth_control_outage or cancelled_oauth_leader or malformed_unicode'
      - name: Repository policy checks
        run: |
          bash scripts/ci-insider-denylist.sh
          uv run python scripts/check_release_contract.py
          uv run python scripts/check_docs.py
      - name: Full suite
        run: uv run pytest -q
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-pr546-auth-finalize.yml
          git add src/unigrok_public/remote_auth.py tests/test_remote_boundary.py
          git commit -m "fix: finalize OAuth outage coalescing"
          git push origin HEAD:chatgpt/pr544-independent-hardening-20260804
