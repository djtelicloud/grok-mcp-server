name: Apply exact local preauthentication scope fix

on:
  push:
    branches:
      - chatgpt/exact-local-preauth-scope-20260805

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-local-preauth-scope-20260805
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path("src/unigrok_public/remote_auth.py")
          auth = auth_path.read_text()
          old_scope_block = '''_LOCAL_PREAUTHENTICATED_SCOPE = (
              "unigrok:connect unigrok:invoke unigrok:review unigrok:status unigrok:chat"
          )
          _LOCAL_PREAUTHENTICATED_SCOPE_SET = frozenset(
              _LOCAL_PREAUTHENTICATED_SCOPE.split()
          )
          '''
          new_scope_block = '''_LOCAL_PREAUTHENTICATED_SCOPE = (
              "unigrok:connect unigrok:invoke unigrok:review unigrok:status unigrok:chat"
          )
          '''
          old_scope_check = "or frozenset(granted.split()) != _LOCAL_PREAUTHENTICATED_SCOPE_SET"
          new_scope_check = "or granted != _LOCAL_PREAUTHENTICATED_SCOPE"
          if auth.count(old_scope_block) != 1 or auth.count(old_scope_check) != 1:
              raise SystemExit("remote authentication source did not match the verified base")
          auth = auth.replace(old_scope_block, new_scope_block, 1)
          auth = auth.replace(old_scope_check, new_scope_check, 1)
          auth_path.write_text(auth)

          test_path = Path("tests/test_postmerge_security_review.py")
          tests = test_path.read_text()
          old_test_scope = '''        "scope": (
                      "unigrok:chat unigrok:status unigrok:review "
                      "unigrok:invoke unigrok:connect"
                  ),
          '''
          new_test_scope = '''        "scope": (
                      "unigrok:connect unigrok:invoke unigrok:review "
                      "unigrok:status unigrok:chat"
                  ),
          '''
          insertion_point = '''

          @pytest.mark.asyncio
          @pytest.mark.parametrize(
              "forged",
          '''
          exact_scope_test = '''

          @pytest.mark.parametrize(
              "scope_value",
              [
                  (
                      "unigrok:chat unigrok:status unigrok:review "
                      "unigrok:invoke unigrok:connect"
                  ),
                  (
                      "unigrok:connect unigrok:invoke unigrok:review "
                      "unigrok:status unigrok:chat unigrok:chat"
                  ),
              ],
          )
          def test_preauthenticated_local_claims_require_exact_scope(
              scope_value: str,
          ) -> None:
              raw = {
                  "active": True,
                  "token_type": "local",
                  "scope": scope_value,
                  "iss": "unigrok:local-token",
                  "sub": "operator",
                  "aud": "local-mcp",
                  "unigrok_principal": "local:operator",
                  "unigrok_auth": "local_token",
              }

              assert (
                  remote_auth._preauthenticated_local_claims({"unigrok.oauth": raw})
                  is None
              )
          '''
          if tests.count(old_test_scope) != 1 or tests.count(insertion_point) != 1:
              raise SystemExit("security regression source did not match the verified base")
          tests = tests.replace(old_test_scope, new_test_scope, 1)
          tests = tests.replace(insertion_point, exact_scope_test + insertion_point, 1)
          test_path.write_text(tests)
          PY
          uv sync --frozen
          uv run ruff check src/unigrok_public/remote_auth.py tests/test_postmerge_security_review.py
          uv run pytest -q tests/test_postmerge_security_review.py tests/test_remote_boundary.py tests/test_oauth_claim_isolation.py
          rm .github/workflows/apply-exact-local-preauth-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/unigrok_public/remote_auth.py tests/test_postmerge_security_review.py .github/workflows/apply-exact-local-preauth-scope.yml
          git commit -m "fix: require exact local preauthentication scope"
          git push origin HEAD:chatgpt/exact-local-preauth-scope-20260805
