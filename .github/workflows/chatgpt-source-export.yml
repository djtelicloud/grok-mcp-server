name: Export staged PR551 media boundary

on:
  push:
    branches:
      - chatgpt/pr544-source-export-20260804
    paths:
      - .github/workflows/chatgpt-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr544-source-export-20260804
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 8b2999732d97f40f199f80dc68e044c3a27caa1a
          path: staged
          fetch-depth: 1
      - run: |
          cp staged/.github/pr551-media-boundary.patch /tmp/pr551-media-boundary.patch
          tar --exclude=.git -C staged -czf /tmp/pr551-staged-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr551-media-boundary-patch
          path: /tmp/pr551-media-boundary.patch
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: pr551-staged-source
          path: /tmp/pr551-staged-source.tgz
          if-no-files-found: error
          retention-days: 1
      - run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .pr551-media-export-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr551-media-export-run-id
          git commit -m "chore: record PR551 media export run"
          git push
