name: ChatGPT OAuth head export

on:
  push:
    branches:
      - chatgpt/pr544-source-export-20260804
    paths:
      - .github/workflows/chatgpt-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/oauth-resilience-20260804
          path: oauth-head
          fetch-depth: 1
      - run: tar --exclude=.git -C oauth-head -czf /tmp/grok-mcp-oauth-head.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: grok-mcp-oauth-head
          path: /tmp/grok-mcp-oauth-head.tgz
          if-no-files-found: error
          retention-days: 1
      - run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .oauth-head-export-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .oauth-head-export-run-id
          git commit -m "chore: record OAuth head export run"
          git push
