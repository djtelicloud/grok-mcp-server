name: ChatGPT source export

on:
  push:
    branches:
      - chatgpt/pr544-source-export-20260804
    paths:
      - .github/workflows/chatgpt-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - run: |
          tar --exclude=.git -czf /tmp/grok-mcp-source.tgz .
          tar -czf /tmp/grok-mcp-venv.tgz .venv
      - uses: actions/upload-artifact@v4
        with:
          name: grok-mcp-source
          path: /tmp/grok-mcp-source.tgz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: grok-mcp-python-env
          path: /tmp/grok-mcp-venv.tgz
          if-no-files-found: error
          retention-days: 1
      - run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .source-export-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-export-run-id
          git commit -m "chore: record source export run"
          git push
