name: Verify and publish PR551 hosted transport boundary

on:
  push:
    branches:
      - chatgpt/pr544-source-export-20260804
    paths:
      - .github/workflows/chatgpt-source-export.yml

permissions:
  contents: write

concurrency:
  group: pr551-hosted-transport-publisher
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr544-source-export-20260804
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: c346ec517578d8d7f66b6d268fd904a2b8f3327d
          path: target
          fetch-depth: 0
      - name: Verify exact target cursor
        working-directory: target
        env:
          EXPECTED_TARGET_HEAD: 7c8ff6ae27c69e33cc84f73638b9b2056c5af296
          TARGET_BRANCH: chatgpt/local-edge-hardening-v2-20260804
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "c346ec517578d8d7f66b6d268fd904a2b8f3327d"
      - name: Apply exact independently authored transport patch
        working-directory: target
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/pr551-hosted-transport.patch
          printf '%s  %s\n' '83432293539c7f2d54bb6cb8183cb15581faf16b80894d97727904657c0ce309' '/tmp/pr551-hosted-transport.patch' | sha256sum --check
          git apply --check /tmp/pr551-hosted-transport.patch
          git apply /tmp/pr551-hosted-transport.patch
          test "$(git diff --name-only)" = $'src/unigrok_public/server.py\ntests/test_transport_security.py'
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
        working-directory: target
      - run: uv run ruff check .
        working-directory: target
      - run: uv run pytest -q tests/test_transport_security.py tests/test_remote_boundary.py -k 'transport or origin or host or cloudrun'
        working-directory: target
      - run: bash scripts/ci-insider-denylist.sh
        working-directory: target
      - run: uv run python scripts/check_release_contract.py
        working-directory: target
      - run: uv run python scripts/check_docs.py
        working-directory: target
      - run: uv run pytest -q
        working-directory: target
      - run: docker build --tag unigrok:pr551-hosted-transport .
        working-directory: target
      - name: Verify live local and hosted transport boundaries
        working-directory: target
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            --env UNIGROK_RUNTIME=cloudrun \
            --env UNIGROK_PUBLIC_MCP_URL=https://mcp.example.test/mcp \
            unigrok:pr551-hosted-transport \
            -c 'from unigrok_public import server; settings = server.mcp.settings.transport_security; assert settings.enable_dns_rebinding_protection is True; assert settings.allowed_hosts[-1] == "mcp.example.test"; assert settings.allowed_origins[-1] == "https://mcp.example.test"'
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            --env UNIGROK_RUNTIME=cloudrun \
            --env UNIGROK_PUBLIC_MCP_URL=https://service.internal/mcp \
            unigrok:pr551-hosted-transport \
            -c 'from unigrok_public import server; settings = server.mcp.settings.transport_security; assert "service.internal" not in settings.allowed_hosts; assert "https://service.internal" not in settings.allowed_origins'
          docker run --detach \
            --name unigrok-pr551-hosted-transport \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /home/appuser/.grok:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /state:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --publish 127.0.0.1:14766:8080 \
            unigrok:pr551-hosted-transport
          trap 'docker logs unigrok-pr551-hosted-transport || true; docker rm --force unigrok-pr551-hosted-transport || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:14766/healthz >/tmp/pr551-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          cat >/tmp/pr551-initialize.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"boundary-test","version":"1"}}}
          JSON
          test "$(curl --silent --output /tmp/pr551-hostile.json --write-out '%{http_code}' --request POST --header 'Host: attacker.invalid' --header 'Accept: application/json, text/event-stream' --header 'Content-Type: application/json' --data-binary @/tmp/pr551-initialize.json http://127.0.0.1:14766/mcp)" = "421"
          test "$(curl --silent --output /tmp/pr551-local.json --write-out '%{http_code}' --request POST --header 'Host: 127.0.0.1:14766' --header 'Origin: http://127.0.0.1:14766' --header 'Accept: application/json, text/event-stream' --header 'Content-Type: application/json' --data-binary @/tmp/pr551-initialize.json http://127.0.0.1:14766/mcp)" = "200"
      - name: Publish clean target commit
        working-directory: target
        env:
          EXPECTED_TARGET_HEAD: 7c8ff6ae27c69e33cc84f73638b9b2056c5af296
          TARGET_BRANCH: chatgpt/local-edge-hardening-v2-20260804
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/unigrok_public/server.py tests/test_transport_security.py
          git commit -m "fix: validate hosted MCP transport authority" -m "Keep FastMCP DNS-rebinding protection enabled locally and in Cloud Run. Hosted Host and Origin values are derived only from the validated public MCP resource. Independently implemented from public Core; no donor code was copied or merged. Verified in GitHub Actions run $GITHUB_RUN_ID."
          published="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" origin "$published:refs/heads/$TARGET_BRANCH"
          printf '%s\n' "$published" > /tmp/pr551-published-commit
      - name: Record verification evidence
        run: |
          set -euo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'base_head=%s\n' 'c346ec517578d8d7f66b6d268fd904a2b8f3327d'
            printf 'replaced_head=%s\n' '7c8ff6ae27c69e33cc84f73638b9b2056c5af296'
            printf 'published_head=%s\n' "$(cat /tmp/pr551-published-commit)"
            printf 'patch_sha256=%s\n' '83432293539c7f2d54bb6cb8183cb15581faf16b80894d97727904657c0ce309'
          } > .pr551-hosted-transport-verification
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr551-hosted-transport-verification
          git commit -m "chore: record PR551 hosted transport verification"
          git push
