name: Export exact PR551 source and environment

on:
  push:
    branches:
      - chatgpt/pr544-source-export-20260804
    paths:
      - .github/workflows/chatgpt-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr544-source-export-20260804
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 6410419723405d46e3ec453bbee4517830d59473
          path: pr551
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
        working-directory: pr551
      - run: |
          tar --exclude=.git -C pr551 -czf /tmp/grok-mcp-pr551-source.tgz .
          tar -C pr551 -czf /tmp/grok-mcp-pr551-venv.tgz .venv
      - uses: actions/upload-artifact@v4
        with:
          name: grok-mcp-pr551-source
          path: /tmp/grok-mcp-pr551-source.tgz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: grok-mcp-pr551-python-env
          path: /tmp/grok-mcp-pr551-venv.tgz
          if-no-files-found: error
          retention-days: 1
      - run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .pr551-export-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr551-export-run-id
          git commit -m "chore: record PR551 export run"
          git push
