name: Publish atomic local daily budget

on:
  push:
    branches:
      - chatgpt/pr554-local-budget-publication-20260805
    paths:
      - .github/pr554-local-budget-apply.py
      - .github/workflows/chatgpt-pr554-local-budget-gate.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: chatgpt-pr554-local-budget-20260805
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'chatgpt/pr554-local-budget-publication-20260805' || github.ref_name == 'chatgpt/pr554-local-budget-publication-20260805')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr554-local-budget-publication-20260805
          fetch-depth: 0
      - name: Verify isolated cursor
        env:
          CLEAN_PARENT: 7aebc9fd657d01dc1522ecaa922401e65cb887a1
        run: |
          set -euo pipefail
          expected="$(printf '%s\n%s' '.github/pr554-local-budget-apply.py' '.github/workflows/chatgpt-pr554-local-budget-gate.yml')"
          test "$(git diff --name-only "$CLEAN_PARENT" HEAD)" = "$expected"
      - name: Apply independently authored local budget
        run: |
          set -euo pipefail
          python .github/pr554-local-budget-apply.py
          git rm .github/pr554-local-budget-apply.py .github/workflows/chatgpt-pr554-local-budget-gate.yml
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src/unigrok_public/caller_budget.py src/unigrok_public/state.py src/unigrok_public/server.py tests/test_local_daily_budget.py --fix
      - run: git diff --check
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_local_daily_budget.py tests/test_caller_budget.py tests/test_remote_boundary.py tests/test_public_boundary.py
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build --tag unigrok:local-daily-budget .
      - name: Verify installed-image budget configuration
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            --env UNIGROK_LOCAL_DAILY_BUDGET_USD=0 \
            unigrok:local-daily-budget \
            -c 'from unigrok_public.caller_budget import load_local_daily_budget; assert load_local_daily_budget() == 0.0'
      - name: Publish clean commit
        env:
          CLEAN_PARENT: 7aebc9fd657d01dc1522ecaa922401e65cb887a1
          TARGET_BRANCH: chatgpt/pr554-local-budget-publication-20260805
        run: |
          set -euo pipefail
          staged_head="$(git rev-parse HEAD)"
          git add -A
          tree="$(git write-tree)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit="$(printf '%s\n\n%s\n' 'security: add an atomic local daily API budget' "Verified in GitHub Actions run $GITHUB_RUN_ID." | git commit-tree "$tree" -p "$CLEAN_PARENT")"
          expected="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' 'SECURITY.md' 'compose.yaml' 'example.env' 'src/unigrok_public/caller_budget.py' 'src/unigrok_public/server.py' 'src/unigrok_public/state.py' 'tests/test_local_daily_budget.py')"
          test "$(git diff-tree --no-commit-id --name-only -r "$commit")" = "$expected"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$staged_head" origin "$commit:refs/heads/$TARGET_BRANCH"
