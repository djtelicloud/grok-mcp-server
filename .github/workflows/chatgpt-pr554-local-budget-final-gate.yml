name: Publish final atomic local daily budget

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: chatgpt-pr554-local-budget-final-20260805
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.head_ref == 'chatgpt/pr554-local-budget-final-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLEAN_PARENT: 7aebc9fd657d01dc1522ecaa922401e65cb887a1
      SOURCE_PARENT: c436f965090e38da5b2b57d2b7ca15a35197cd89
      TARGET_BRANCH: chatgpt/pr554-local-budget-final-20260805
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify isolated cursor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base HEAD "$CLEAN_PARENT")" = "$CLEAN_PARENT"
          expected_bootstrap="$(printf '%s\n%s' '.github/pr554-local-budget-finalize.py' '.github/workflows/chatgpt-pr554-local-budget-final-gate.yml')"
          test "$(git diff --name-only "$SOURCE_PARENT" HEAD)" = "$expected_bootstrap"
          expected_all="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s' '.github/pr554-local-budget-finalize.py' '.github/workflows/chatgpt-pr554-local-budget-final-gate.yml' 'SECURITY.md' 'compose.yaml' 'example.env' 'src/unigrok_public/caller_budget.py' 'src/unigrok_public/server.py' 'src/unigrok_public/state.py' 'tests/test_local_daily_budget.py')"
          test "$(git diff --name-only "$CLEAN_PARENT" HEAD)" = "$expected_all"
      - name: Apply independently authored race corrections
        run: |
          set -euo pipefail
          python .github/pr554-local-budget-finalize.py
          git rm .github/pr554-local-budget-finalize.py .github/workflows/chatgpt-pr554-local-budget-final-gate.yml
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src/unigrok_public/caller_budget.py src/unigrok_public/server.py tests/test_local_daily_budget.py --fix
      - run: git diff --check
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_local_daily_budget.py tests/test_caller_budget.py tests/test_circuit_breaker.py tests/test_public_boundary.py -k 'budget or breaker or public_mcp_tool_contract'
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build --tag unigrok:local-daily-budget-final .
      - name: Verify installed-image reentrant budget contract
        run: |
          set -euo pipefail
          docker run --rm \
            --env UNIGROK_LOCAL_DAILY_BUDGET_USD=1 \
            --entrypoint /app/.venv/bin/python \
            unigrok:local-daily-budget-final \
            -c '
          import asyncio
          import tempfile
          from pathlib import Path
          from unigrok_public.caller_budget import reserve_caller_budget
          from unigrok_public.state import PublicStateStore

          async def verify():
              with tempfile.TemporaryDirectory() as directory:
                  store = PublicStateStore(Path(directory) / "state.db")
                  outer = await reserve_caller_budget(store)
                  inner = await reserve_caller_budget(store)
                  assert outer.store is store
                  assert inner.store is None
                  await inner.exhaust()
                  assert (await store.get_local_budget_status(1.0))["status"] == "busy"
                  await outer.settle(0.25)
                  replacement = await reserve_caller_budget(store)
                  assert replacement.store is store
                  await replacement.settle(0.0)

          asyncio.run(verify())
          '
      - name: Publish clean commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git add -A
          expected="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' 'SECURITY.md' 'compose.yaml' 'example.env' 'src/unigrok_public/caller_budget.py' 'src/unigrok_public/server.py' 'src/unigrok_public/state.py' 'tests/test_local_daily_budget.py')"
          test "$(git diff --cached --name-only "$CLEAN_PARENT")" = "$expected"
          tree="$(git write-tree)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(printf '%s\n\n%s\n' 'security: add race-safe atomic local daily spend guard' "Verified in GitHub Actions run $GITHUB_RUN_ID." | git commit-tree "$tree" -p "$CLEAN_PARENT")"
          test "$(git rev-parse "$commit^")" = "$CLEAN_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r "$commit")" = "$expected"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "$commit:refs/heads/$TARGET_BRANCH"
