name: PR549 exact container gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  container-boundary:
    if: github.head_ref == 'chatgpt/pr544-local-edge-hardening-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag unigrok:pr549-exact .
      - name: Verify optional local authentication in the live image
        run: |
          set -euo pipefail
          LOCAL_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run --detach \
            --name unigrok-pr549-exact \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /home/appuser/.grok:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /state:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --env UNIGROK_LOCAL_MCP_TOKEN="$LOCAL_TOKEN" \
            --publish 127.0.0.1:14765:8080 \
            unigrok:pr549-exact
          trap 'docker logs unigrok-pr549-exact || true; docker rm --force unigrok-pr549-exact || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:14765/healthz >/tmp/pr549-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          test "$(curl --silent --output /tmp/pr549-anonymous.json --write-out '%{http_code}' http://127.0.0.1:14765/v1/models)" = "401"
          test "$(curl --silent --output /tmp/pr549-valid.txt --write-out '%{http_code}' --header "Authorization: Bearer $LOCAL_TOKEN" http://127.0.0.1:14765/v1/models)" = "404"
          test "$(curl --silent --output /tmp/pr549-forwarded.json --write-out '%{http_code}' --header "Authorization: Bearer $LOCAL_TOKEN" --header 'X-Forwarded-For: 127.0.0.1' http://127.0.0.1:14765/v1/models)" = "403"
          test "$(curl --silent --output /tmp/pr549-ready.json --write-out '%{http_code}' http://127.0.0.1:14765/readyz)" != "401"
      - name: Verify the default no-token image remains compatible
        run: |
          set -euo pipefail
          docker rm --force unigrok-pr549-exact
          docker run --detach \
            --name unigrok-pr549-exact \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /home/appuser/.grok:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /state:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --publish 127.0.0.1:14765:8080 \
            unigrok:pr549-exact
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:14765/healthz >/tmp/pr549-default-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          test "$(curl --silent --output /tmp/pr549-default.txt --write-out '%{http_code}' http://127.0.0.1:14765/v1/models)" = "404"
      - run: git diff --check
