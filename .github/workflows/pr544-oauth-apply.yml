name: Apply independent PR544 OAuth hardening

on:
  push:
    branches:
      - chatgpt/pr544-independent-hardening-20260804
    paths:
      - .github/pr544-oauth-apply.py.gz.b64
      - .github/workflows/pr544-oauth-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr544-independent-hardening-20260804
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: base64 --decode .github/pr544-oauth-apply.py.gz.b64 | gzip --decompress > /tmp/pr544-oauth-apply.py
      - run: python /tmp/pr544-oauth-apply.py
      - run: git rm .github/pr544-oauth-apply.py.gz.b64 .github/workflows/pr544-oauth-apply.yml
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build --tag unigrok:pr544-oauth .
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/unigrok_public/remote_auth.py tests/test_oauth_control_resilience.py
          git commit -m "Harden OAuth control failure handling"
          git push origin HEAD:chatgpt/pr544-independent-hardening-20260804
