name: Final public Core security verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chatgpt-pr554-final-verification-20260805
  cancel-in-progress: false

jobs:
  verify:
    if: github.head_ref == 'chatgpt/pr554-final-verification-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f0670bdb63d64fe06d8f4a0d1374769dcbcca29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: test "$(git rev-parse HEAD)" = "7f0670bdb63d64fe06d8f4a0d1374769dcbcca29"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: docker build --tag unigrok:pr554-final .
      - name: Start hardened local container
        run: |
          set -euo pipefail
          docker run --detach \
            --name unigrok-pr554-local \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /home/appuser/.grok:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /state:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --env UNIGROK_LOCAL_AUTO=off \
            --env UNIGROK_STATE_PATH=/state/unigrok-public.db \
            --publish 127.0.0.1:14765:8080 \
            unigrok:pr554-final
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:14765/healthz >/tmp/pr554-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Verify local health, readiness, and runtime truth
        run: |
          set -euo pipefail
          ready_status="$(curl --silent --output /tmp/pr554-ready.json --write-out '%{http_code}' http://127.0.0.1:14765/readyz)"
          test "$ready_status" = "503"
          curl --fail --silent --show-error http://127.0.0.1:14765/runtimez >/tmp/pr554-runtime.json
          python - <<'PY'
          import json

          with open('/tmp/pr554-health.json', encoding='utf-8') as stream:
              health = json.load(stream)
          with open('/tmp/pr554-ready.json', encoding='utf-8') as stream:
              ready = json.load(stream)
          with open('/tmp/pr554-runtime.json', encoding='utf-8') as stream:
              runtime = json.load(stream)
          assert health['status'] == 'ok', health
          assert ready['status'] == 'not_ready', ready
          assert ready['bootstrap']['can_chat'] is False, ready
          assert runtime['version'] == '1.1.0', runtime
          assert runtime['tool_count'] == 29, runtime
          print('local_http=ok version=1.1.0 tools=29 ready=not_ready')
          PY
      - name: Verify MCP handshake, catalog, discovery, and confirmation gate
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import asyncio
          import json
          from typing import Any

          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          EXPECTED_TOOLS = [
              'agent',
              'agent_result',
              'review_pull_request',
              'chat',
              'grok_mcp_discover_self',
              'grok_mcp_onboard_client',
              'grok_mcp_status',
              'benchmark_status',
              'record_benchmark_result',
              'list_models',
              'list_sessions',
              'session_history',
              'forget_session',
              'remember_fact',
              'search_knowledge',
              'forget_fact',
              'web_search',
              'x_search',
              'remote_code_execution',
              'chat_with_vision',
              'chat_with_files',
              'generate_image',
              'generate_video',
              'extend_video',
              'xai_upload_file',
              'xai_list_files',
              'xai_get_file',
              'xai_get_file_content',
              'xai_delete_file',
          ]


          def structured(result: Any) -> dict[str, Any]:
              value = getattr(result, 'structuredContent', None)
              if isinstance(value, dict):
                  nested = value.get('result', value)
                  return nested if isinstance(nested, dict) else {}
              for item in getattr(result, 'content', []):
                  raw = getattr(item, 'text', None)
                  if not isinstance(raw, str):
                      continue
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(payload, dict):
                      return payload
              return {}


          async def main() -> None:
              async with streamablehttp_client(
                  'http://127.0.0.1:14765/mcp',
                  headers={'X-Client-ID': 'pr554-final-gate'},
              ) as (read, write, _):
                  async with ClientSession(read, write) as session:
                      initialized = await session.initialize()
                      assert initialized.serverInfo.version == '1.1.0', initialized
                      listed = await session.list_tools()
                      names = [tool.name for tool in listed.tools]
                      assert names == EXPECTED_TOOLS, names
                      status_result = await session.call_tool(
                          'grok_mcp_status', {'refresh': True}
                      )
                      assert not status_result.isError, status_result
                      status = structured(status_result)
                      assert status.get('tool_count') == 29, status
                      discover_result = await session.call_tool(
                          'grok_mcp_discover_self', {}
                      )
                      assert not discover_result.isError, discover_result
                      discover = structured(discover_result)
                      discovered = [
                          tool.get('name') for tool in discover.get('tools', [])
                      ]
                      assert discovered == EXPECTED_TOOLS, discovered
                      destructive = await session.call_tool(
                          'forget_session',
                          {'session': 'pr554-final-confirmation-probe'},
                      )
                      assert destructive.isError, destructive
                      print('mcp_catalog=ok version=1.1.0 tools=29 confirmation=blocked')


          asyncio.run(main())
          PY
      - name: Start hardened hosted container
        run: |
          set -euo pipefail
          SERVICE_TOKEN="$(python -c 'print("s" * 48)')"
          printf '%s' "$SERVICE_TOKEN" >/tmp/pr554-service-token
          docker run --detach \
            --name unigrok-pr554-cloudrun \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /home/appuser/.grok:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /state:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --env UNIGROK_RUNTIME=cloudrun \
            --env UNIGROK_STATE_PATH=/state/unigrok-public.db \
            --env UNIGROK_PUBLIC_MCP_URL=https://mcp.example.test/mcp \
            --env UNIGROK_OAUTH_AUTHORIZATION_SERVERS=https://auth.example.test \
            --env UNIGROK_OAUTH_INTROSPECTION_URL=https://auth.example.test/oauth/introspect \
            --env UNIGROK_OAUTH_SCOPES=unigrok:connect,unigrok:invoke,unigrok:review,unigrok:status \
            --env UNIGROK_SERVICE_TOKENS="$SERVICE_TOKEN" \
            --publish 127.0.0.1:14768:8080 \
            unigrok:pr554-final
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:14768/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Verify hosted authority boundary on final image
        run: |
          set -euo pipefail
          SERVICE_TOKEN="$(cat /tmp/pr554-service-token)"
          cat >/tmp/pr554-initialize.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"pr554-final-boundary","version":"1"}}}
          JSON
          request() {
            local host="$1"
            local origin="$2"
            local output="$3"
            curl --silent --output "$output" --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/json, text/event-stream' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $SERVICE_TOKEN" \
              --header "Host: $host" \
              --header "Origin: $origin" \
              --data-binary @/tmp/pr554-initialize.json \
              http://127.0.0.1:14768/mcp
          }
          public_status="$(request mcp.example.test https://mcp.example.test /tmp/pr554-public.txt)"
          case "$public_status" in
            200|406) ;;
            *) cat /tmp/pr554-public.txt; exit 1 ;;
          esac
          hostile_host_status="$(request attacker.invalid https://mcp.example.test /tmp/pr554-hostile-host.txt)"
          hostile_origin_status="$(request mcp.example.test https://attacker.invalid /tmp/pr554-hostile-origin.txt)"
          test "$hostile_host_status" = "421"
          test "$hostile_origin_status" = "403"
          echo "hosted_boundary=ok public=$public_status hostile_host=$hostile_host_status hostile_origin=$hostile_origin_status"
      - name: Show container logs
        if: always()
        run: |
          docker logs unigrok-pr554-local || true
          docker logs unigrok-pr554-cloudrun || true
      - name: Remove verification containers
        if: always()
        run: |
          docker rm --force unigrok-pr554-local unigrok-pr554-cloudrun >/dev/null 2>&1 || true
