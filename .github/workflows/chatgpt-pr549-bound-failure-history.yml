name: ChatGPT PR549 record bounded-history lineage

on:
  push:
    branches:
      - chatgpt/pr544-local-edge-hardening-20260804
    paths:
      - .github/workflows/chatgpt-pr549-bound-failure-history.yml

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr544-local-edge-hardening-20260804
          fetch-depth: 0
      - run: |
          git fetch origin chatgpt/pr544-source-export-20260804
          git worktree add /tmp/pr549-lineage origin/chatgpt/pr544-source-export-20260804
          {
            printf 'observer_run=%s\n' "$GITHUB_RUN_ID"
            printf 'observer_head=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow_parent=%s\n' "$(git rev-parse HEAD^)"
            printf 'verified_commit=%s\n' "$(git rev-parse HEAD^^)"
            printf 'verified_message_begin\n'
            git log -1 --format=%B HEAD^^
            printf 'verified_message_end\n'
          } > /tmp/pr549-lineage/.pr549-bounded-history-lineage
          cd /tmp/pr549-lineage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr549-bounded-history-lineage
          git commit -m "chore: record PR549 bounded-history lineage"
          git push origin HEAD:chatgpt/pr544-source-export-20260804
