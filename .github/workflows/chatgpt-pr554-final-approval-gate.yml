name: Finalize PR 554 approval gate

on:
  push:
    branches:
      - chatgpt/pr554-final-approval-gate-v2-20260805

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CANDIDATE_BRANCH: chatgpt/usena-public-core-security-20260805
      DONOR_PR: '544'
      SECURITY_PR: '554'
      TEMP_BUDGET_PR: '560'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for clean candidate publication
        run: |
          set -euo pipefail
          clean=false
          for _ in $(seq 1 72); do
            git fetch --force origin "$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH" main
            candidate="$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH")"
            helpers="$(git diff --name-only origin/main..."$candidate" | grep -E '^\.github/(pr554-|workflows/chatgpt-pr554)' || true)"
            if [ -z "$helpers" ]; then
              clean=true
              break
            fi
            sleep 5
          done
          test "$clean" = true
          printf 'CANDIDATE_SHA=%s\n' "$candidate" >> "$GITHUB_ENV"
      - name: Freeze exact candidate
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test -z "$(git diff --name-only origin/main...HEAD | grep -E '^\.github/(pr554-|workflows/chatgpt-pr554)' || true)"
          git fetch --force origin "pull/$DONOR_PR/head:refs/remotes/origin/pr544-donor"
          if git merge-base --is-ancestor refs/remotes/origin/pr544-donor HEAD; then
            echo 'Donor PR ancestry detected' >&2
            exit 1
          fi
          git diff --check origin/main...HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install exact lockfile
        run: uv sync --frozen --python 3.12
      - name: Static and repository contracts
        run: |
          set -euo pipefail
          uv run ruff check .
          bash scripts/ci-insider-denylist.sh
          uv run python scripts/check_release_contract.py
          uv run python scripts/check_docs.py
      - name: Full test suite
        run: |
          set -euo pipefail
          uv run pytest -q | tee /tmp/pr554-pytest.log
          summary="$(grep -E '[0-9]+ passed' /tmp/pr554-pytest.log | tail -1)"
          test -n "$summary"
          printf 'TEST_SUMMARY=%s\n' "$summary" >> "$GITHUB_ENV"
      - name: Build exact candidate image
        run: docker build --tag unigrok:pr554-final .
      - name: Verify installed image and live HTTP boundary
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/.venv/bin/python unigrok:pr554-final -c '
          import asyncio
          from unigrok_public import server
          tools = asyncio.run(server.mcp.list_tools())
          names = [tool.name for tool in tools]
          assert names == list(server.PUBLIC_TOOL_NAMES)
          assert len(names) == 29
          assert server.mcp._mcp_server.version == "1.1.0"
          '
          docker run --rm --entrypoint /app/.venv/bin/python unigrok:pr554-final -c '
          import asyncio
          from collections.abc import Sequence
          from unigrok_public.tools import media

          async def main() -> None:
              release = asyncio.Event()
              started = asyncio.Event()
              active = 0

              async def stalled(_host: str, _port: int) -> Sequence[str]:
                  nonlocal active
                  active += 1
                  if active == media.MEDIA_DNS_CONCURRENCY:
                      started.set()
                  try:
                      await release.wait()
                      return ["93.184.216.34"]
                  finally:
                      active -= 1

              tasks = [
                  asyncio.create_task(
                      media.validated_public_media_url(
                          f"https://stalled-{index}.example.com/a.png",
                          "image_url",
                          resolver=stalled,
                          timeout_seconds=0.02,
                          total_timeout_seconds=0.1,
                      )
                  )
                  for index in range(media.MEDIA_DNS_CONCURRENCY)
              ]
              await asyncio.wait_for(started.wait(), timeout=1)
              results = await asyncio.gather(*tasks, return_exceptions=True)
              assert all(isinstance(result, ValueError) for result in results)
              assert active == media.MEDIA_DNS_CONCURRENCY
              assert len(media._MEDIA_DNS_TASKS) == media.MEDIA_DNS_CONCURRENCY

              admitted = False

              async def fifth(_host: str, _port: int) -> Sequence[str]:
                  nonlocal admitted
                  admitted = True
                  return ["93.184.216.34"]

              try:
                  await media.validated_public_media_url(
                      "https://fifth.example.com/a.png",
                      "image_url",
                      resolver=fifth,
                      timeout_seconds=0.02,
                      total_timeout_seconds=0.1,
                  )
              except ValueError:
                  pass
              else:
                  raise AssertionError("resolver capacity was over-admitted")
              assert admitted is False
              release.set()
              for _ in range(100):
                  if active == 0 and not media._MEDIA_DNS_TASKS:
                      break
                  await asyncio.sleep(0.01)
              assert active == 0
              assert not media._MEDIA_DNS_TASKS

          asyncio.run(main())
          '
          docker run --detach --name unigrok-pr554-live --publish 127.0.0.1:48765:8080 unigrok:pr554-final
          trap 'docker rm --force unigrok-pr554-live >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:48765/healthz >/tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          test "$(curl --silent --output /tmp/healthz.json --write-out '%{http_code}' http://127.0.0.1:48765/healthz)" = 200
          test "$(curl --silent --output /tmp/runtimez.json --write-out '%{http_code}' http://127.0.0.1:48765/runtimez)" = 200
          ready_code="$(curl --silent --output /tmp/readyz.json --write-out '%{http_code}' http://127.0.0.1:48765/readyz)"
          test "$ready_code" = 200 -o "$ready_code" = 503
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/healthz.json').read_text())
          runtime = json.loads(Path('/tmp/runtimez.json').read_text())
          ready = json.loads(Path('/tmp/readyz.json').read_text())
          assert health['status'] == 'ok'
          assert runtime['version'] == '1.1.0'
          assert runtime['tool_count'] == 29
          assert ready['status'] in {'ready', 'not_ready'}
          PY
      - name: Confirm exact remote head remains verified
        run: |
          set -euo pipefail
          git fetch --force origin "$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_SHA"
      - name: Prepare PR 554 for human merge approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/pr554-body.md <<EOF
          ## Ready for final human approval

          This is the authoritative independently implemented public-Core security change. No donor commit, file, patch, or branch code was merged, copied, or cherry-picked.

          ### Security coverage

          - cancellation-safe, bounded OAuth introspection coalescing
          - retryable 503 handling for temporary authorization-control failures; explicit inactive-token denial remains 401
          - deterministic malformed-Unicode identity rejection
          - optional local bearer authentication with bounded abuse state
          - local and hosted Host/Origin rebinding protection
          - public-media URL and DNS boundary with resolver slots retained through timeout completion
          - safe-by-default IDE onboarding and exact Cursor hook matching
          - optional atomic local daily metered-spend ceiling

          ### Exact-head verification

          - Commit: \`$CANDIDATE_SHA\`
          - Full suite: **$TEST_SUMMARY**
          - Ruff, insider denylist, release contract, documentation contract: passed
          - Docker build: passed
          - Installed-image MCP catalog: 29 tools, version 1.1.0
          - Live container: health/runtime passed; readiness remained truthful
          - Media resolver timeout-capacity proof: passed

          ### Provenance

          Curtis (\`cfrat33\`) and PR #544 are credited as the source of donor security ideas. The implementation and regression tests were independently authored from public \`main\`.
          EOF
          gh pr edit "$SECURITY_PR" --repo "$GITHUB_REPOSITORY" --title 'security: harden public Core trust boundaries' --body-file /tmp/pr554-body.md
          gh pr ready "$SECURITY_PR" --repo "$GITHUB_REPOSITORY"
          gh pr comment "$SECURITY_PR" --repo "$GITHUB_REPOSITORY" --body "Final independent gate passed on exact head \`$CANDIDATE_SHA\`: $TEST_SUMMARY; Docker, live HTTP boundary, 29-tool MCP catalog, and resolver-capacity proof passed. Ready for David's final merge approval."
          gh pr close "$TEMP_BUDGET_PR" --repo "$GITHUB_REPOSITORY" --comment 'Completed and promoted into PR #554; closing this temporary gate without merge.' || true
      - name: Remove temporary gate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${GITHUB_REF_NAME//\//%2F}" || true
