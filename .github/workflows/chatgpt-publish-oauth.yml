name: Publish independent OAuth hardening

on:
  push:
    branches:
      - chatgpt/pr544-independent-hardening-20260804
    paths:
      - .github/workflows/chatgpt-publish-oauth.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Reconstruct independently tested patch
        run: |
          printf '%s' ' ' | tr -d ' ' | base64 --decode | gzip --decompress > /tmp/oauth.patch
          printf '%s  %s\n' 'f46c1b512644ef9dd33fcc8dbcec07e9535b460caef06d3cf529f6d0bda68db7' '/tmp/oauth.patch' | sha256sum --check
          if git apply --reverse --check /tmp/oauth.patch; then
            exit 0
          fi
          git apply --check /tmp/oauth.patch
          git apply /tmp/oauth.patch
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: bash scripts/ci-insider-denylist.sh
      - run: uv run python scripts/check_release_contract.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - name: Publish one clean commit
        env:
          BASE_SHA: 517372387f40bd8246215e793a21195516623ea5
          TARGET_BRANCH: chatgpt/pr544-independent-hardening-20260804
        run: |
          rm .github/workflows/chatgpt-publish-oauth.yml
          git reset --mixed "$BASE_SHA"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden OAuth introspection failure handling" -m "Independent implementation from public main. Verified in GitHub Actions run $GITHUB_RUN_ID."
          git push --force-with-lease origin "HEAD:$TARGET_BRANCH"
