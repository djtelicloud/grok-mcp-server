name: PR544 independent OAuth recovery v2

on:
  push:
    branches:
      - chatgpt/pr544-finalizer-20260804-v4
    paths:
      - .github/workflows/pr544-independent-oauth-recovery-v2.yml

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr544-independent-unicode-finalizer
  cancel-in-progress: false

env:
  TARGET_BRANCH: chatgpt/pr544-independent-hardening-20260804
  DONOR_PR: "544"
  REVIEWED_DONOR_CURSOR: d1426ebc24e2dae508065d67cb911d60b7f7bc88

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read repository governance
        run: |
          set -euo pipefail
          mapfile -t instruction_files < <(find .. -name AGENTS.md -type f -print | sort)
          if [ "${#instruction_files[@]}" -eq 0 ]; then
            printf '%s\n' "AGENTS.md not found" >&2
            exit 1
          fi
          for file in "${instruction_files[@]}"; do
            printf '\n===== %s =====\n' "$file"
            cat "$file"
          done
          mapfile -t usena_files < <(grep -RIl --exclude-dir=.git -E 'USENA|Usena|usena' . | sort || true)
          if [ "${#usena_files[@]}" -eq 0 ]; then
            printf '%s\n' "USENA policy not found" >&2
            exit 1
          fi
          for file in "${usena_files[@]}"; do
            printf '\n===== %s =====\n' "$file"
            cat "$file"
          done

      - name: Select the newest safe isolated head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git fetch origin "$TARGET_BRANCH"; then
            if git merge-base --is-ancestor origin/main "origin/$TARGET_BRANCH"; then
              git switch -C "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            elif git merge-base --is-ancestor "origin/$TARGET_BRANCH" origin/main; then
              git switch -C "$TARGET_BRANCH" origin/main
            else
              printf '%s\n' "publication branch diverged from public main" >&2
              exit 1
            fi
          else
            git switch -C "$TARGET_BRANCH" origin/main
          fi
          donor_json="$(gh pr view "$DONOR_PR" --repo "$GITHUB_REPOSITORY" --json number,state,headRefOid,headRefName,author,url,title)"
          printf '%s\n' "$donor_json" > /tmp/pr544-donor-metadata.json
          printf 'DONOR_HEAD=%s\n' "$(printf '%s' "$donor_json" | jq -r '.headRefOid')" >> "$GITHUB_ENV"
          printf 'DONOR_STATE=%s\n' "$(printf '%s' "$donor_json" | jq -r '.state')" >> "$GITHUB_ENV"
          printf 'BASE_SHA=%s\n' "$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
          printf 'START_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install repository test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          extra="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path("pyproject.toml")
          if not path.exists():
              print("")
              raise SystemExit
          data = tomllib.loads(path.read_text(encoding="utf-8"))
          extras = data.get("project", {}).get("optional-dependencies", {})
          selected = [name for name in ("dev", "test", "tests") if name in extras]
          print(f".[{','.join(selected)}]" if selected else ".")
          PY
          )"
          python -m pip install -e "$extra"
          python -m pip install pytest pytest-asyncio

      - name: Generate independent OAuth behavior regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          candidates = []
          for path in Path(".").rglob("*.py"):
              if any(part in {".git", ".venv", "venv", "site-packages"} for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8")
              if "def canonical_oauth_principal(" in text and "class RemoteOAuthMiddleware" in text:
                  candidates.append((path, text))
          if len(candidates) != 1:
              raise SystemExit(f"expected one remote OAuth module, found {len(candidates)}")
          auth_path, source = candidates[0]
          ast.parse(source)
          module_parts = list(auth_path.with_suffix("").parts)
          if module_parts and module_parts[0] == "src":
              module_parts = module_parts[1:]
          module_name = ".".join(module_parts)
          test_path = Path("tests/test_oauth_control_state.py")
          test_source = f'''from __future__ import annotations

import asyncio
import importlib
import json
from typing import Any

import pytest


auth = importlib.import_module({module_name!r})


class _ControlResponse:
    status_code = 200
    headers: dict[str, str] = {{}}

    def __init__(self, payload: dict[str, Any]) -> None:
        self._payload = payload
        self.content = json.dumps(payload).encode("utf-8")
        self.text = self.content.decode("utf-8")

    def json(self) -> dict[str, Any]:
        return self._payload

    def raise_for_status(self) -> None:
        return None


class _ControlClient:
    calls = 0
    mode = ""
    issuer = ""
    audience = ""
    started: asyncio.Event
    release: asyncio.Event

    def __init__(self, *args: Any, **kwargs: Any) -> None:
        return None

    async def __aenter__(self) -> _ControlClient:
        return self

    async def __aexit__(self, *args: Any) -> bool:
        return False

    async def post(self, *args: Any, **kwargs: Any) -> _ControlResponse:
        type(self).calls += 1
        type(self).started.set()
        await type(self).release.wait()
        if type(self).mode == "outage":
            request = auth.httpx.Request(
                "POST",
                "https://control.example.test/introspect",
            )
            raise auth.httpx.ConnectError(
                "temporary OAuth control outage",
                request=request,
            )
        payload: dict[str, Any] = {{"active": False}}
        if type(self).mode == "unicode":
            payload = {{
                "active": True,
                "scope": "unigrok:connect",
                "iss": type(self).issuer,
                "sub": chr(0xD800),
                "aud": type(self).audience,
            }}
        return _ControlResponse(payload)


def _clear_introspection_state() -> None:
