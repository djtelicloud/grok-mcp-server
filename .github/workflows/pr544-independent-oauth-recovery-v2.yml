      - name: Commit and push verified recovery
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A -- "$AUTH_PATH" "$TEST_PATH" tests/test_oauth_unicode_concurrency.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "security: preserve OAuth control failure semantics"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          printf 'FIX_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or refresh draft and donor credit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          focused_result="$(tail -n 1 /tmp/pr544-focused-tests.txt)"
          full_result="$(tail -n 1 /tmp/pr544-full-tests.txt)"
          docker_result="$(tail -n 1 /tmp/pr544-docker-build.txt)"
          cat > /tmp/pr544-pr-body.md <<EOF
          ## Summary

          - Distinguishes retryable OAuth-control failures from explicit token denial.
          - Coalesces simultaneous validation for the same token and scope without retaining raw bearer tokens.
          - Shields shared validation work so cancellation of the first waiter does not cancel the result for other callers.
          - Rejects malformed non-UTF-8 OAuth identity claims without allowing an exception to escape.
          - Bounds in-flight OAuth validation state and returns retryable HTTP 503 only for control-plane failure; explicit denial and invalid claims remain HTTP 401.

          ## Verification

          - Focused state regressions: \`$focused_result\`
          - Full repository suite: \`$full_result\`
          - Container verification: \`$docker_result\`
          - Public-main merge base: \`$BASE_SHA\`
          - Starting isolated head: \`$START_SHA\`
          - Verified fix head: \`$FIX_SHA\`

          ## Provenance

          This implementation was rebuilt independently from public \`main\`. PR #544 by @cfrat33 was used only as donor research for security behaviors. No donor-branch code was merged, copied, or cherry-picked.

          Thanks to Curtis (@cfrat33) for the security ideas and evidence contributed through PR #544. The donor PR head observed at publication was \`$DONOR_HEAD\` with state \`$DONOR_STATE\`; the task's initial reviewed cursor was \`$REVIEWED_DONOR_CURSOR\`.
          EOF
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$TARGET_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$TARGET_BRANCH" --title "security: preserve OAuth control failure semantics" --body-file /tmp/pr544-pr-body.md)"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "security: preserve OAuth control failure semantics" --body-file /tmp/pr544-pr-body.md
          fi
          marker='<!-- pr544-independent-credit-recorded -->'
          existing_comments="$(gh pr view "$DONOR_PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body] | join("\n")')"
          if ! grep -Fq "$marker" <<<"$existing_comments"; then
            gh pr comment "$DONOR_PR" --repo "$GITHUB_REPOSITORY" --body "$marker
          Thanks @cfrat33 (Curtis) for the security ideas and evidence in this donor PR. The OAuth control-state and malformed-Unicode fixes have now been implemented independently from public main, with no donor code merged, copied, or cherry-picked. The independent draft is #$pr_number."
          fi
          printf 'PR_NUMBER=%s\n' "$pr_number" >> "$GITHUB_ENV"
          printf 'PR_URL=https://github.com/%s/pull/%s\n' "$GITHUB_REPOSITORY" "$pr_number" >> "$GITHUB_ENV"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr544-independent-oauth-recovery-v2
          path: |
            /tmp/pr544-donor-metadata.json
            /tmp/pr544-oauth-paths.json
            /tmp/pr544-oauth-probe.txt
            /tmp/pr544-focused-tests.txt
            /tmp/pr544-full-tests.txt
            /tmp/pr544-docker-build.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write workflow summary
        run: |
          set -euo pipefail
          {
            printf '## Independent OAuth recovery v2\n\n'
            printf -- '- Draft PR: %s\n' "$PR_URL"
            printf -- '- Merge base: `%s`\n' "$BASE_SHA"
            printf -- '- Start SHA: `%s`\n' "$START_SHA"
            printf -- '- Fix SHA: `%s`\n' "$FIX_SHA"
            printf -- '- Donor head: `%s`\n' "$DONOR_HEAD"
            printf -- '- Donor state: `%s`\n' "$DONOR_STATE"
            printf -- '- Focused tests: `%s`\n' "$(tail -n 1 /tmp/pr544-focused-tests.txt)"
            printf -- '- Full tests: `%s`\n' "$(tail -n 1 /tmp/pr544-full-tests.txt)"
            printf -- '- Container: `%s`\n' "$(tail -n 1 /tmp/pr544-docker-build.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
