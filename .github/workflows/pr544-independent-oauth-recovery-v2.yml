async def _request(middleware: Any, token: str) -> int:
    body = json.dumps(
        {{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {{}}}},
        separators=(",", ":"),
    ).encode("utf-8")
    delivered = False
    messages: list[dict[str, Any]] = []

    async def receive() -> dict[str, Any]:
        nonlocal delivered
        if not delivered:
            delivered = True
            return {{"type": "http.request", "body": body, "more_body": False}}
        await asyncio.sleep(0)
        return {{"type": "http.disconnect"}}

    async def send(message: dict[str, Any]) -> None:
        messages.append(message)

    scope = {{
        "type": "http",
        "asgi": {{"version": "3.0", "spec_version": "2.3"}},
        "http_version": "1.1",
        "method": "POST",
        "scheme": "https",
        "path": "/mcp",
        "raw_path": b"/mcp",
        "query_string": b"",
        "root_path": "",
        "headers": [
            (b"host", b"mcp.example.test"),
            (b"authorization", f"Bearer {{token}}".encode("latin-1")),
            (b"content-type", b"application/json"),
            (b"content-length", str(len(body)).encode("ascii")),
        ],
        "client": ("8.8.8.8", 43100),
        "server": ("mcp.example.test", 443),
        "state": {{}},
    }}
    await middleware(scope, receive, send)
    starts = [
        message
        for message in messages
        if message.get("type") == "http.response.start"
    ]
    assert len(starts) == 1
    return int(starts[0]["status"])


async def _batch(
    monkeypatch: pytest.MonkeyPatch,
    *,
    mode: str,
    token: str,
    count: int,
) -> tuple[list[int | BaseException], int, int]:
    issuer, audience = _configure(monkeypatch)
    _ControlClient.calls = 0
    _ControlClient.mode = mode
    _ControlClient.issuer = issuer
    _ControlClient.audience = audience
    _ControlClient.started = asyncio.Event()
    _ControlClient.release = asyncio.Event()
    inner_calls = 0

    async def inner_app(scope: dict[str, Any], receive: Any, send: Any) -> None:
        nonlocal inner_calls
        inner_calls += 1
        await send({{"type": "http.response.start", "status": 204, "headers": []}})
        await send({{"type": "http.response.body", "body": b""}})

    middleware = auth.RemoteOAuthMiddleware(inner_app)
    tasks = [
        asyncio.create_task(_request(middleware, token)) for _ in range(count)
    ]
    await asyncio.wait_for(_ControlClient.started.wait(), timeout=2.0)
    await asyncio.sleep(0.02)
    _ControlClient.release.set()
    results = await asyncio.gather(*tasks, return_exceptions=True)
    return results, _ControlClient.calls, inner_calls


@pytest.mark.asyncio
async def test_temporary_oauth_control_outage_is_retryable_for_all_callers(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    results, calls, inner_calls = await _batch(
        monkeypatch,
        mode="outage",
        token="coalesced-control-outage-token",
        count=32,
    )
    assert results == [503] * 32
    assert calls == 1
    assert inner_calls == 0


@pytest.mark.asyncio
async def test_explicit_oauth_token_denial_is_unauthorized_for_all_callers(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    results, calls, inner_calls = await _batch(
        monkeypatch,
        mode="denial",
        token="coalesced-explicit-denial-token",
        count=32,
    )
    assert results == [401] * 32
    assert calls == 1
    assert inner_calls == 0


@pytest.mark.asyncio
async def test_malformed_unicode_identity_is_unauthorized_for_all_callers(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    results, calls, inner_calls = await _batch(
        monkeypatch,
        mode="unicode",
        token="coalesced-malformed-unicode-token",
        count=32,
    )
    assert results == [401] * 32
    assert calls == 1
    assert inner_calls == 0


@pytest.mark.asyncio
async def test_cancelled_first_waiter_does_not_cancel_shared_control_request(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    issuer, audience = _configure(monkeypatch)
    _ControlClient.calls = 0
    _ControlClient.mode = "outage"
    _ControlClient.issuer = issuer
    _ControlClient.audience = audience
    _ControlClient.started = asyncio.Event()
    _ControlClient.release = asyncio.Event()
    inner_calls = 0

    async def inner_app(scope: dict[str, Any], receive: Any, send: Any) -> None:
        nonlocal inner_calls
        inner_calls += 1
        await send({{"type": "http.response.start", "status": 204, "headers": []}})
        await send({{"type": "http.response.body", "body": b""}})

    middleware = auth.RemoteOAuthMiddleware(inner_app)
    leader = asyncio.create_task(
        _request(middleware, "cancelled-control-outage-token")
    )
    await asyncio.wait_for(_ControlClient.started.wait(), timeout=2.0)
    follower = asyncio.create_task(
        _request(middleware, "cancelled-control-outage-token")
    )
    await asyncio.sleep(0.02)
    leader.cancel()
    with pytest.raises(asyncio.CancelledError):
        await leader
    _ControlClient.release.set()
    assert await follower == 503
    assert _ControlClient.calls == 1
    assert inner_calls == 0
'''
