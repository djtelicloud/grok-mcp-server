    pass


_OAUTH_INTROSPECTION_INFLIGHT_LIMIT = 1_024
_OAUTH_INTROSPECTION_INFLIGHT: dict[
    tuple[bytes, str], asyncio.Task[dict[str, Any] | None]
] = {}


def _discard_oauth_introspection(
    key: tuple[bytes, str],
    task: asyncio.Task[dict[str, Any] | None],
) -> None:
    if _OAUTH_INTROSPECTION_INFLIGHT.get(key) is task:
        _OAUTH_INTROSPECTION_INFLIGHT.pop(key, None)
    if not task.cancelled():
        task.exception()


async def _introspect_oauth_token_once(
    token: str,
    required: str,
) -> dict[str, Any] | None:
    url = introspection_url()
    if not url:
        raise _OAuthControlUnavailable("OAuth introspection is not configured")
    try:
        async with httpx.AsyncClient(
            timeout=5.0,
            follow_redirects=False,
            trust_env=False,
        ) as client:
            response = await client.post(
                url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "User-Agent": "unigrok-public-remote-mcp/1",
                },
                data={"required_scope": required},
            )
    except httpx.HTTPError as exc:
        raise _OAuthControlUnavailable("OAuth introspection request failed") from exc
    if response.status_code != 200 or len(response.content) > 16_384:
        raise _OAuthControlUnavailable(
            "OAuth introspection returned an unusable response"
        )
    try:
        payload = response.json()
    except (TypeError, ValueError, UnicodeError) as exc:
        raise _OAuthControlUnavailable(
            "OAuth introspection returned invalid JSON"
        ) from exc
    if not isinstance(payload, dict):
        raise _OAuthControlUnavailable(
            "OAuth introspection returned a non-object payload"
        )
    if payload.get("active") is False:
        return None
    if payload.get("active") is not True:
        raise _OAuthControlUnavailable(
            "OAuth introspection omitted an explicit token state"
        )
    scopes = payload.get("scope")
    granted = set(scopes.split()) if isinstance(scopes, str) else set()
    if not set(required.split()).issubset(granted):
        return None
    principal = canonical_oauth_principal(payload.get("iss"), payload.get("sub"))
    if principal is None:
        return None
    audience = payload.get("aud")
    if isinstance(audience, str):
        audiences = (audience,)
    elif (
        isinstance(audience, list)
        and len(audience) <= 16
        and all(isinstance(item, str) and len(item) <= 2_048 for item in audience)
    ):
        audiences = tuple(audience)
    else:
        return None
    if public_mcp_resource() not in audiences:
        return None
    return {
        "active": True,
        "scope": scopes,
        "unigrok_principal": principal,
        "unigrok_auth": "oauth",
    }


async def introspect_oauth_token(token: str, required: str) -> dict[str, Any] | None:
    if not token or len(token) > 8_192:
        return None
    key = (hashlib.sha256(token.encode("utf-8")).digest(), required)
    task = _OAUTH_INTROSPECTION_INFLIGHT.get(key)
    if task is None:
        for existing_key, existing_task in tuple(
            _OAUTH_INTROSPECTION_INFLIGHT.items()
        ):
            if existing_task.done():
                _discard_oauth_introspection(existing_key, existing_task)
        if len(_OAUTH_INTROSPECTION_INFLIGHT) >= _OAUTH_INTROSPECTION_INFLIGHT_LIMIT:
            raise _OAuthControlUnavailable(
                "OAuth introspection capacity is temporarily exhausted"
            )
        task = asyncio.create_task(_introspect_oauth_token_once(token, required))
        _OAUTH_INTROSPECTION_INFLIGHT[key] = task
        task.add_done_callback(
            lambda completed, task_key=key: _discard_oauth_introspection(
                task_key,
                completed,
            )
        )
    return await asyncio.shield(task)
